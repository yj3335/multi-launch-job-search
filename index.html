<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Yash's Job Search Engine</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1>Yash's Job Search Engine</h1>
  </header>

  <nav class="tabs" role="tablist">
    <button type="button" class="tab-btn" role="tab" data-tab="launcher" aria-selected="true" aria-controls="tabPanelLauncher">Search Launcher</button>
    <button type="button" class="tab-btn" role="tab" data-tab="listings" aria-selected="false" aria-controls="tabPanelListings">Live Listings</button>
  </nav>

  <section id="tabPanelLauncher" class="tab-panel" role="tabpanel">
    <div class="panel">
      <div class="controls">
        <div>
          <label class="field-label" for="jobTitle">Job title</label>
          <input type="text" id="jobTitle" placeholder="e.g. Software Engineer" autocomplete="off" />
        </div>
        <div>
          <label class="field-label" for="timeFilter">Posted within</label>
          <select id="timeFilter"></select>
        </div>
        <div>
          <label class="field-label" for="location">Location <span class="field-optional">(if not remote)</span></label>
          <input type="text" id="location" placeholder="e.g. New York, Canada &mdash; leave blank for anywhere" autocomplete="off" />
        </div>
        <div>
          <label class="field-label" for="excludeTerms">
            Exclude terms <span class="field-optional">(optional)</span>
            <button type="button" class="info-btn" aria-label="How does Exclude terms work?">
              ?
              <span class="tooltip" role="tooltip">
                Comma&#8209;separated terms to filter out, e.g. "Senior, Manager" to skip postings containing either word.
                Applied as <code>-term</code> on Google searches and <code>NOT term</code> on LinkedIn.
              </span>
            </button>
          </label>
          <input type="text" id="excludeTerms" placeholder="e.g. Senior, Manager" autocomplete="off" />
        </div>
        <div>
          <label class="field-label" for="remoteOnly">
            Remote only
            <button type="button" class="info-btn" aria-label="What does Remote only do?">
              ?
              <span class="tooltip" role="tooltip">
                Adds "remote" to each search. Uncheck to search a specific location instead (the Location field above), or
                anywhere if it's left blank.
              </span>
            </button>
          </label>
          <label class="control-box" for="remoteOnly">
            <input type="checkbox" id="remoteOnly" checked />
            <span>Search only remote roles</span>
          </label>
        </div>
        <div>
          <label class="field-label" for="batchSize">
            Sites per tab
            <button type="button" class="info-btn" aria-label="What does Sites per tab do?">
              ?
              <span class="tooltip" role="tooltip">
                Combines several platforms' <code>site:</code> filters into each tab instead of opening one tab per platform &mdash;
                fewer simultaneous tabs means fewer get blocked as pop&#8209;ups, and fewer near&#8209;identical Google searches
                fired at once means less chance of tripping a captcha. If you still see one blocked, allow pop&#8209;ups for this
                page once and click again; LinkedIn and Remote Rocketship always open as their own tab since they aren't Google
                searches.
              </span>
            </button>
          </label>
          <label class="control-box" for="batchSize">
            <input type="number" id="batchSize" min="1" max="15" value="6" />
            <span>platforms combined per tab</span>
          </label>
        </div>
      </div>

      <div class="status-row">
        <div class="count"><strong id="selCount">0</strong> of <span id="totalCount">0</span> sources selected <span id="tabsPreview"></span></div>
        <div class="links">
          <button type="button" id="selectAll">Select all</button>
          <button type="button" id="selectNone">Select none</button>
        </div>
      </div>

      <button type="button" class="launch-btn" id="launchBtn" disabled>Launch all selected searches &rarr;</button>
    </div>

    <div id="groups"></div>
  </section>

  <section id="tabPanelListings" class="tab-panel" role="tabpanel" hidden>
    <div class="panel">
      <p class="panel-intro">Reads the structured data behind SimplifyJobs' trackers directly &mdash; no search ranking involved, so nothing gets buried.</p>
      <div class="controls">
        <div>
          <label class="field-label" for="listingsSource">Data source</label>
          <select id="listingsSource"></select>
        </div>
        <div id="listingsCustomUrlWrap" style="display: none;">
          <label class="field-label" for="listingsCustomUrl">Custom listings.json URL</label>
          <input type="text" id="listingsCustomUrl" placeholder="https://raw.githubusercontent.com/.../listings.json" autocomplete="off" />
        </div>
        <div>
          <label class="field-label" for="listingsKeyword">Keyword</label>
          <input type="text" id="listingsKeyword" placeholder="e.g. Software Engineer" autocomplete="off" />
        </div>
        <div>
          <label class="field-label" for="listingsLocation">Location</label>
          <input type="text" id="listingsLocation" placeholder="e.g. New York, Remote" autocomplete="off" />
        </div>
        <div>
          <label class="field-label" for="listingsPostedWithin">Posted within</label>
          <select id="listingsPostedWithin"></select>
        </div>
      </div>

      <button type="button" class="fetch-btn" id="listingsRefresh">Fetch listings</button>
      <div class="status-row">
        <div class="count" id="listingsStatus">Not loaded yet</div>
      </div>

      <div id="listingsResults"></div>
    </div>
  </section>
</div>

<footer>
  Search launcher rebuilds the logic of <a href="https://briansjobsearch.com/" target="_blank" rel="noopener">Brian's Job Search</a>.
  Live Listings reads data from <a href="https://github.com/SimplifyJobs/New-Grad-Positions" target="_blank" rel="noopener">SimplifyJobs</a>' trackers.
</footer>

<script src="js/search-builder.js"></script>
<script src="js/sources.js"></script>
<script src="js/info-tooltip.js"></script>
<script src="js/app.js"></script>
<script src="js/listings.js"></script>
<script src="js/tabs.js"></script>
</body>
</html>
